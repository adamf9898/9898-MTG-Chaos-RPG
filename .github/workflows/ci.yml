name: CI

on:
    push:
        branches: ['main', 'develop']
    pull_request:
        branches: ['main', 'develop']

permissions:
    contents: read

jobs:
    lint-and-test:
        name: Lint & Test
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run bounded quality audit
              run: npm run verify

            - name: Add audit report to job summary
              if: always()
              run: |
                  if [ -f reports/generated/quality-audit.md ]; then
                    cat reports/generated/quality-audit.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "The quality audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload audit reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: quality-audit-${{ github.run_id }}
                  path: reports/generated/quality-audit.*
                  if-no-files-found: warn

    codeql:
        name: CodeQL Security Scan
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4

name: Daily Repository Quality Audit

on:
    workflow_dispatch:
    schedule:
        - cron: '30 5 * * *'

permissions:
    contents: read

concurrency:
    group: quality-audit-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        name: Read-only quality audit
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run bounded quality audit
              run: npm run verify

            - name: Add audit report to job summary
              if: always()
              run: |
                  if [ -f reports/generated/quality-audit.md ]; then
                    cat reports/generated/quality-audit.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "The quality audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload audit reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: scheduled-quality-audit-${{ github.run_id }}
                  path: reports/generated/quality-audit.*
                  if-no-files-found: warn
